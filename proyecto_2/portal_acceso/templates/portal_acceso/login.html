<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de sesión | Proyecto 2</title>
    <style>
      body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#0f172a,#1d4ed8); color:white; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
      .card { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); padding:32px; border-radius:16px; width: min(420px, 90vw); }
      h2 { text-align:center; margin-bottom:20px; }
      form { display:grid; gap:14px; }
      input { padding:12px; border-radius:10px; border:none; }
      button { padding:12px; border-radius:10px; background:#22c55e; color:white; border:none; font-weight:700; cursor:pointer; }
      .error { background:#fee2e2; color:#991b1b; padding:10px; border-radius:8px; margin-bottom:12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Portal de acceso</h2>
      {% if messages %}
        {% for message in messages %}
          <div class="error">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Usuario" required />
        <input type="password" name="password" placeholder="Contraseña" required />
        <button type="submit">Ingresar</button>
      </form>
    </div>
  </body>
</html>
